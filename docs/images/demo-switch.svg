<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480">
<rect width="980" height="480" rx="10" fill="#1e1e2e"/>
<circle cx="22" cy="20" r="6" fill="#f38ba8"/><circle cx="42" cy="20" r="6" fill="#f9e2af"/><circle cx="62" cy="20" r="6" fill="#a6e3a1"/>
<text x="490.0" y="25" fill="#9399b2" font-family="Menlo,Consolas,monospace" font-size="13" text-anchor="middle">pswitch — add / list / use</text>
<text x="20" y="60" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> <tspan fill="#cdd6f4" font-weight="bold">pswitch add claude myrelay --url https://api.myrelay.dev --key sk-demo-claude-0001 --model claude-sonnet-4-5</tspan></text>
<text x="20" y="80" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">added claude/myrelay</tspan></text>
<text x="20" y="100" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> <tspan fill="#cdd6f4" font-weight="bold">pswitch add codex myrelay --url https://api.myrelay.dev/v1 --key sk-demo-codex-0002 --model gpt-5-codex</tspan></text>
<text x="20" y="120" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">added codex/myrelay</tspan></text>
<text x="20" y="140" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> <tspan fill="#cdd6f4" font-weight="bold">pswitch list</tspan></text>
<text x="20" y="160" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">claude:</tspan></text>
<text x="20" y="180" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#f9e2af">  * official</tspan></text>
<text x="20" y="200" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bac2de">    myrelay  https://api.myrelay.dev  model=claude-sonnet-4-5  key=sk-d…0001</tspan></text>
<text x="20" y="220" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">codex:</tspan></text>
<text x="20" y="240" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#f9e2af">  * official</tspan></text>
<text x="20" y="260" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bac2de">    myrelay  https://api.myrelay.dev/v1  model=gpt-5-codex  key=sk-d…0002  wire=responses</tspan></text>
<text x="20" y="280" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> <tspan fill="#cdd6f4" font-weight="bold">pswitch use claude myrelay</tspan></text>
<text x="20" y="300" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">claude -&gt; myrelay</tspan></text>
<text x="20" y="320" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#6c7086">Start a new Claude Code session for it to take effect.</tspan></text>
<text x="20" y="340" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> <tspan fill="#cdd6f4" font-weight="bold">pswitch use codex myrelay</tspan></text>
<text x="20" y="360" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">codex -&gt; myrelay</tspan></text>
<text x="20" y="380" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#6c7086">Restart Codex for it to take effect.</tspan></text>
<text x="20" y="400" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> <tspan fill="#cdd6f4" font-weight="bold">pswitch current</tspan></text>
<text x="20" y="420" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">claude: myrelay</tspan></text>
<text x="20" y="440" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#89b4fa">codex: myrelay</tspan></text>
</svg>